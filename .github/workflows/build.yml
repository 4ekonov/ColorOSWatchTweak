name: Build deb

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + SDK
        uses: Randomblock1/theos-action@v1

      - name: Build rootless deb (Dopamine / palera1n rootless)
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Show result
        run: |
          ls -la packages
          for f in packages/*.deb; do dpkg-deb -I "$f" || true; done

      # Номер сборки в имени артефакта — всегда видно, какой запуск свежий
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOSClock-deb-${{ github.run_number }}
          path: packages/*.deb
